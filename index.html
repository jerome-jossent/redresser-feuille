<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redresser une feuille (OpenCV.js)</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#666;--card:#f1f1f1;--accent:#0b6bcb;--accent-fg:#fff;--border:#d8d8d8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#eee;--muted:#aaa;--card:#242424;--accent:#4a9dff;--accent-fg:#06121f;--border:#3a3a3a}}
:root[data-theme="dark"]{--bg:#141414;--fg:#eee;--muted:#aaa;--card:#242424;--accent:#4a9dff;--accent-fg:#06121f;--border:#3a3a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 12px}
h2{font-size:1rem;margin:16px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button,.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.alt{background:var(--card);color:var(--fg);border:1px solid var(--border)}
#status,#cvState{color:var(--muted);font-size:.9rem;margin:4px 0}
#status{min-height:1.4em}
video,canvas,img{display:block;width:100%;max-width:100%;height:auto;border-radius:8px;background:var(--card);margin:8px 0}
#video{aspect-ratio:4/3;object-fit:cover}
canvas{touch-action:none;cursor:crosshair}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Redresser une feuille</h1>
<div class="row">
  <button id="bCam">Démarrer la caméra</button>
  <button id="bShot" disabled>Prendre la photo</button>
  <label class="btn alt">Choisir une photo<input id="file" type="file" accept="image/*" hidden></label>
</div>
<p id="status">Démarre la caméra, ou choisis une photo existante.</p>
<p id="cvState">OpenCV.js : chargement (environ 10 Mo)…</p>

<video id="video" playsinline muted autoplay hidden></video>

<div id="editor" hidden>
  <h2>1. Touche les 4 coins (dans n'importe quel ordre)</h2>
  <canvas id="cvs"></canvas>
  <div class="row"><button id="bReset" class="alt" disabled>Recommencer les points</button></div>
</div>

<div id="result" hidden>
  <h2>2. Résultat redressé</h2>
  <img id="out" alt="Feuille redressée">
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const video=$('video'),cvs=$('cvs'),ctx=cvs.getContext('2d'),out=$('out');
let track=null,bmp=null,scale=1,pts=[],drag=-1,CV=null; // CV = objet OpenCV.js une fois prêt
const say=t=>$('status').textContent=t;

/* ---------- Chargement d'OpenCV.js ---------- */
(function loadOpenCV(){
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js';
  s.onerror=()=>{$('cvState').textContent="OpenCV.js : échec du chargement (réseau ?)";};
  s.onload=async()=>{
    try{
      let c=window.cv;
      if(c instanceof Promise)c=await c;                                   // builds >= 4.11
      else if(!c.Mat)await new Promise(r=>{c.onRuntimeInitialized=r;});    // builds <= 4.10
      CV=c;
      $('cvState').textContent='OpenCV.js : prêt ✓';
      if(pts.length===4)warp();
    }catch(e){$('cvState').textContent='OpenCV.js : erreur d\'initialisation';}
  };
  document.head.appendChild(s);
})();

/* ---------- Caméra : flux 640x480, photo en pleine résolution ---------- */
$('bCam').onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;video.hidden=false;
    track=stream.getVideoTracks()[0];
    $('bShot').disabled=false;
    say('Caméra active. Cadre la feuille puis prends la photo.');
  }catch(e){
    say('Caméra indisponible ('+e.name+'). Utilise « Choisir une photo ».');
  }
};

$('bShot').onclick=async()=>{
  try{
    let blob=null;
    if('ImageCapture' in window){
      const ic=new ImageCapture(track);
      try{
        const c=await ic.getPhotoCapabilities();
        blob=await ic.takePhoto({imageWidth:c.imageWidth.max,imageHeight:c.imageHeight.max});
      }catch(_){blob=await ic.takePhoto();}
    }
    if(!blob){ // repli : image du flux (basse résolution)
      const c=document.createElement('canvas');
      c.width=video.videoWidth;c.height=video.videoHeight;
      c.getContext('2d').drawImage(video,0,0);
      blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));
    }
    await loadBlob(blob);
  }catch(e){say('Échec de la capture : '+e.message);}
};

$('file').onchange=e=>{if(e.target.files[0])loadBlob(e.target.files[0]);};

async function loadBlob(blob){
  bmp=await createImageBitmap(blob);
  cvs.width=Math.min(bmp.width,1000);
  cvs.height=Math.round(bmp.height*cvs.width/bmp.width);
  scale=cvs.width/bmp.width;
  pts=[];drag=-1;
  $('editor').hidden=false;$('result').hidden=true;$('bReset').disabled=true;
  draw();
  say(`Photo ${bmp.width}×${bmp.height}. Touche les 4 coins de la feuille.`);
  $('editor').scrollIntoView({behavior:'smooth'});
}

/* ---------- Points : tap pour ajouter, glisser pour ajuster ---------- */
function pos(e){
  const r=cvs.getBoundingClientRect();
  const x=(e.clientX-r.left)*cvs.width/r.width/scale;
  const y=(e.clientY-r.top)*cvs.height/r.height/scale;
  return [Math.max(0,Math.min(bmp.width,x)),Math.max(0,Math.min(bmp.height,y))];
}
cvs.addEventListener('pointerdown',e=>{
  const q=pos(e);
  if(pts.length<4){pts.push(q);drag=pts.length-1;}
  else{ // déplace le point le plus proche
    let b=0,bd=Infinity;
    pts.forEach((p,i)=>{const d=(p[0]-q[0])**2+(p[1]-q[1])**2;if(d<bd){bd=d;b=i;}});
    drag=b;pts[b]=q;
  }
  cvs.setPointerCapture(e.pointerId);
  $('bReset').disabled=false;draw();
});
cvs.addEventListener('pointermove',e=>{if(drag>=0){pts[drag]=pos(e);draw();}});
cvs.addEventListener('pointerup',()=>{
  if(drag>=0){drag=-1;draw();if(pts.length===4)warp();else say(`${pts.length}/4 points placés.`);}
});
$('bReset').onclick=()=>{pts=[];$('result').hidden=true;$('bReset').disabled=true;draw();say('Touche les 4 coins de la feuille.');};

/* Ordonne les 4 points : haut-gauche, haut-droite, bas-droite, bas-gauche */
function order(p){
  const s=q=>q[0]+q[1],d=q=>q[1]-q[0];
  return [p.reduce((a,b)=>s(b)<s(a)?b:a),p.reduce((a,b)=>d(b)<d(a)?b:a),
          p.reduce((a,b)=>s(b)>s(a)?b:a),p.reduce((a,b)=>d(b)>d(a)?b:a)];
}

function draw(){
  ctx.drawImage(bmp,0,0,cvs.width,cvs.height);
  const p=pts.map(q=>[q[0]*scale,q[1]*scale]);
  const k=cvs.width/(cvs.getBoundingClientRect().width||cvs.width); // pixels du canvas par pixel d'écran
  if(p.length>1){
    const s=p.length===4?order(p):p;
    ctx.beginPath();
    s.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
    if(p.length===4)ctx.closePath();
    ctx.lineWidth=2*k;ctx.strokeStyle='#00e0a0';ctx.stroke();
  }
  p.forEach(q=>{
    ctx.beginPath();ctx.arc(q[0],q[1],6*k,0,7);
    ctx.fillStyle='#ff3b30';ctx.fill();ctx.lineWidth=1.5*k;ctx.strokeStyle='#fff';ctx.stroke();
  });
  // Loupe affichée au-dessus du doigt pendant le déplacement d'un point
  if(drag>=0&&pts[drag]){
    const LR=65*k,Z=3,[px,py]=p[drag],[sx,sy]=pts[drag];
    const cx=Math.max(LR,Math.min(cvs.width-LR,px));
    let cy=py-120*k;
    if(cy<LR)cy=py+120*k;
    const h=LR/Z/scale;
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,LR,0,7);ctx.clip();
    ctx.fillStyle='#000';ctx.fillRect(cx-LR,cy-LR,2*LR,2*LR);
    ctx.drawImage(bmp,sx-h,sy-h,2*h,2*h,cx-LR,cy-LR,2*LR,2*LR);
    ctx.restore();
    ctx.lineWidth=2*k;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,LR,0,7);ctx.stroke();
    ctx.strokeStyle='#ff3b30';ctx.lineWidth=k;ctx.beginPath();
    ctx.moveTo(cx-LR*.35,cy);ctx.lineTo(cx+LR*.35,cy);ctx.moveTo(cx,cy-LR*.35);ctx.lineTo(cx,cy+LR*.35);
    ctx.stroke();
  }
}

/* ---------- Redressement avec OpenCV.js ---------- */
function warp(){
  if(!CV){say("OpenCV.js n'est pas encore prêt, le calcul se lancera dès qu'il le sera.");return;}
  const [tl,tr,br,bl]=order(pts);
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=Math.max(dist(tl,tr),dist(bl,br)),H=Math.max(dist(tl,bl),dist(tr,br));
  const k=Math.min(1,2400/Math.max(W,H));
  W=Math.round(W*k);H=Math.round(H*k);
  if(W<2||H<2)return;
  say('Calcul…');
  setTimeout(()=>{
    const mats=[];
    try{
      // photo pleine résolution -> Mat
      const sc=document.createElement('canvas');sc.width=bmp.width;sc.height=bmp.height;
      sc.getContext('2d').drawImage(bmp,0,0);
      const src=CV.imread(sc),dst=new CV.Mat();
      // 4 coins source -> 4 coins du rectangle
      const from=CV.matFromArray(4,1,CV.CV_32FC2,[tl[0],tl[1],tr[0],tr[1],br[0],br[1],bl[0],bl[1]]);
      const to=CV.matFromArray(4,1,CV.CV_32FC2,[0,0,W-1,0,W-1,H-1,0,H-1]);
      mats.push(src,dst,from,to);
      const M=CV.getPerspectiveTransform(from,to);mats.push(M);
      CV.warpPerspective(src,dst,M,new CV.Size(W,H),CV.INTER_LINEAR,CV.BORDER_CONSTANT,new CV.Scalar(0,0,0,255));
      const dc=document.createElement('canvas');
      CV.imshow(dc,dst);
      out.src=dc.toDataURL('image/jpeg',.92);
      $('result').hidden=false;
      say(`Résultat : ${W}×${H} px. Appui long sur l'image pour l'enregistrer. Glisse un point pour ajuster.`);
    }catch(e){
      say('Erreur OpenCV : '+(typeof e==='number'?'code '+e:e.message||e));
    }finally{
      mats.forEach(m=>m.delete()); // OpenCV.js ne libère pas la mémoire tout seul
    }
  },20);
}
</script>
</body>
</html>
